set -g @theme_bg       "#1e1e2e"
set -g @theme_surface0 "#313244"
set -g @theme_surface1 "#45475a"
set -g @theme_overlay0 "#6c7086"
set -g @theme_text     "#cdd6f4"

set -g @theme_primary  "#cba6f7"
set -g @theme_secondary "#b4befe"
set -g @theme_blue     "#89b4fa"

# Status
set -Fg status-style "bg=default,fg=#{@theme_text}"

# Session
set -g status-left "#[fg=#{@theme_bg},bg=#{@theme_primary},bold] #S #[fg=#{@theme_primary},bg=#{@theme_bg}] "

# Right
set -g status-right "#[fg=#{@theme_blue}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#{@theme_overlay0}]#h "

# Windows
set -g window-status-format "#[fg=#{@theme_overlay0},bg=#{@theme_bg}] #I:#W "

set -g window-status-current-format "#[fg=#{@theme_bg},bg=#{@theme_secondary},bold] #I:#W "

# Pane borders
set -Fg pane-border-style "fg=#{@theme_surface1}"
set -Fg pane-active-border-style "fg=#{@theme_primary}"

# Messages
set -Fg message-style "bg=#{@theme_surface0},fg=#{@theme_text},bold"
set -Fg message-command-style "bg=#{@theme_surface0},fg=#{@theme_blue},bold"

# Copy mode
set -Fg mode-style "bg=#{@theme_blue},fg=#{@theme_bg},bold"

# Clock
setw -Fg clock-mode-colour "#{@theme_primary}"
