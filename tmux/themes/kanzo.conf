
# Backgrounds
set -g @theme_bg         "#090E13"
set -g @theme_bg_alt     "#1C1E25"
set -g @theme_surface0   "#22262D"
set -g @theme_surface1   "#393B44"

# Foreground / grays
set -g @theme_text       "#C5C9C7"
set -g @theme_text_bright "#F2F1EF"
set -g @theme_overlay0   "#717C7C"
set -g @theme_overlay1   "#909398"
set -g @theme_muted      "#5C6066"

# Main accents
set -g @theme_primary    "#938AA9"
set -g @theme_secondary  "#8BA4B0"

# Additional accents
set -g @theme_blue       "#7FB4CA"
set -g @theme_aqua       "#8EA4A2"
set -g @theme_green      "#8A9A7B"
set -g @theme_yellow     "#C4B28A"
set -g @theme_orange     "#B6927B"
set -g @theme_red        "#C4746E"
set -g @theme_pink       "#A292A3"


# ============================================================
# STATUS BAR
# ============================================================

set -Fg status-style "bg=default,fg=#{@theme_text}"


# ============================================================
# SESSION NAME
# ============================================================

set -g status-left \
"#[fg=#{@theme_bg},bg=#{@theme_primary},bold] #S #[fg=#{@theme_primary},bg=#{@theme_bg}] "


# ============================================================
# RIGHT STATUS
# ============================================================

set -g status-right \
"#[fg=#{@theme_blue}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#{@theme_overlay0}]#h "


# ============================================================
# INACTIVE WINDOWS
# ============================================================

set -g window-status-format \
"#[fg=#{@theme_overlay0},bg=#{@theme_bg}] #I:#W "


# ============================================================
# ACTIVE WINDOW
# ============================================================

set -g window-status-current-format \
"#[fg=#{@theme_bg},bg=#{@theme_secondary},bold] #I:#W "


# ============================================================
# PANE BORDERS
# ============================================================

set -Fg pane-border-style \
"fg=#{@theme_surface1}"

set -Fg pane-active-border-style \
"fg=#{@theme_primary}"


# ============================================================
# TMUX MESSAGES
# ============================================================

set -Fg message-style \
"bg=#{@theme_surface0},fg=#{@theme_text},bold"

set -Fg message-command-style \
"bg=#{@theme_surface0},fg=#{@theme_blue},bold"


# ============================================================
# COPY MODE
# ============================================================

set -Fg mode-style \
"bg=#{@theme_blue},fg=#{@theme_bg},bold"


# ============================================================
# CLOCK MODE
# ============================================================

setw -Fg clock-mode-colour "#{@theme_primary}"
