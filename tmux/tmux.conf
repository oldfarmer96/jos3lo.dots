# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Config and help
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane controls
bind x kill-pane
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane

# Resize panes
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Palette
set -g @ctp_crust    "#11111b"
set -g @ctp_mantle   "#181825"
set -g @ctp_base     "#1e1e2e"
set -g @ctp_surface0 "#313244"
set -g @ctp_surface1 "#45475a"
set -g @ctp_overlay0 "#6c7086"
set -g @ctp_overlay1 "#7f849c"
set -g @ctp_text     "#cdd6f4"

set -g @ctp_blue     "#89b4fa"
set -g @ctp_lavender "#b4befe"
set -g @ctp_mauve    "#cba6f7"
set -g @ctp_teal     "#94e2d5"
set -g @ctp_green    "#a6e3a1"
set -g @ctp_yellow   "#f9e2af"
set -g @ctp_peach    "#fab387"
set -g @ctp_red      "#f38ba8"

# Theme

# Status bar
# set -g status-style "bg=#{@ctp_base},fg=#{@ctp_text}"
set -g status-style "bg=default,fg=#{@ctp_text}"

# Session name
set -g status-left "#[fg=#{@ctp_crust},bg=#{@ctp_mauve},bold] #S #[fg=#{@ctp_mauve},bg=#{@ctp_base}] "

# Right information
set -g status-right "#[fg=#{@ctp_blue}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#{@ctp_overlay0}]#h "

# Inactive windows
set -g window-status-format \
"#[fg=#{@ctp_overlay0},bg=#{@ctp_base}] #I:#W "

# Active window
set -g window-status-current-format \
"#[fg=#{@ctp_crust},bg=#{@ctp_lavender},bold] #I:#W "

# Pane borders
set -g pane-border-style \
"fg=#{@ctp_surface1}"

set -g pane-active-border-style \
"fg=#{@ctp_mauve}"

# Messages shown by tmux
set -g message-style \
"bg=#{@ctp_surface0},fg=#{@ctp_text},bold"

set -g message-command-style \
"bg=#{@ctp_surface0},fg=#{@ctp_blue},bold"

# Copy mode
set -g mode-style \
"bg=#{@ctp_blue},fg=#{@ctp_crust},bold"

# Clock mode
setw -g clock-mode-colour "#{@ctp_mauve}"

