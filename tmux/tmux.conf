# Cambiar prefix de C-b a C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Recargar configuración
bind q source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded"

# COPY MODE - VI
setw -g mode-keys vi

# Iniciar selección
bind -T copy-mode-vi v send-keys -X begin-selection

# Copiar selección y salir
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# PANE NAVIGATION
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split horizontal
bind | split-window -h -c "#{pane_current_path}"

# Split vertical
bind - split-window -v -c "#{pane_current_path}"

# Cerrar pane
bind x kill-pane

# PANE NAVIGATION WITHOUT PREFIX
bind -n C-M-Left  select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up    select-pane -U
bind -n C-M-Down  select-pane -D

# RESIZE PANES
bind -n C-M-S-Left  resize-pane -L 5
bind -n C-M-S-Down  resize-pane -D 5
bind -n C-M-S-Up    resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Renombrar ventana
bind r command-prompt -I "#W" "rename-window -- '%%'"

# Crear nueva ventana en el directorio actual
bind c new-window -c "#{pane_current_path}"

# Cerrar ventana
bind X kill-window

# Alt + número
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt + flechas
bind -n M-Left  select-window -t -1
bind -n M-Right select-window -t +1

# Alt + Shift + flechas -> mover ventanas
bind -n M-S-Left  swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1


# Renombrar sesión
bind R command-prompt -I "#S" "rename-session -- '%%'"

# Crear sesión nueva
bind C new-session -c "#{pane_current_path}"

# Cerrar sesión
bind K kill-session

# Cambiar entre sesiones
bind P switch-client -p
bind N switch-client -n

# Alt + Up/Down para cambiar sesión
bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n


# GENERAL

# Terminal con 256 colores
set -g default-terminal "tmux-256color"

# True Color / RGB
set -ag terminal-overrides ",*:RGB"

# Mouse
set -g mouse on

# Empezar ventanas desde 1
set -g base-index 1

# Empezar panes desde 1
setw -g pane-base-index 1

# Reordenar números de ventanas automáticamente
set -g renumber-windows on

# Historial
set -g history-limit 50000

# Eventos de focus
set -g focus-events on

# Clipboard
set -g set-clipboard on

# Passthrough
set -g allow-passthrough on

# Resize
setw -g aggressive-resize on

# No cerrar tmux cuando se destruya la sesión actual
set -g detach-on-destroy off

# Extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# Tiempo de escape
set -sg escape-time 10

# STATUS BAR GENERAL

# Barra arriba
set -g status-position top

# Actualización cada 5 segundos
set -g status-interval 5

# Tamaños
set -g status-left-length 30
set -g status-right-length 50

# Sin separador entre ventanas
set -g window-status-separator ""

# Nombre automático de ventanas
setw -g automatic-rename on

# Usar nombre del directorio actual
setw -g automatic-rename-format '#{b:pane_current_path}'

# CATPPUCCIN MOCHA PALETTE

# Base colors
set -g @ctp_crust    "#11111b"
set -g @ctp_mantle   "#181825"
set -g @ctp_base     "#1e1e2e"

# Surfaces
set -g @ctp_surface0 "#313244"
set -g @ctp_surface1 "#45475a"

# Overlays
set -g @ctp_overlay0 "#6c7086"
set -g @ctp_overlay1 "#7f849c"

# Text
set -g @ctp_text     "#cdd6f4"

# Accent colors
set -g @ctp_blue     "#89b4fa"
set -g @ctp_lavender "#b4befe"
set -g @ctp_mauve    "#cba6f7"
set -g @ctp_teal     "#94e2d5"
set -g @ctp_green    "#a6e3a1"
set -g @ctp_yellow   "#f9e2af"
set -g @ctp_peach    "#fab387"
set -g @ctp_red      "#f38ba8"


# CATPPUCCIN THEME

# STATUS BAR

# Fondo transparente/default + texto Catppuccin
set -Fg status-style "bg=default,fg=#{@ctp_text}"

# SESSION NAME - LEFT
set -g status-left "#[fg=#{@ctp_crust},bg=#{@ctp_mauve},bold] #S #[fg=#{@ctp_mauve},bg=#{@ctp_base}] "

# RIGHT INFORMATION

# Muestra:
# COPY   -> cuando estás en copy mode
# PREFIX -> cuando presionaste C-a
# ZOOM   -> cuando un pane está maximizado
# hostname

set -g status-right "#[fg=#{@ctp_blue}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#{@ctp_overlay0}]#h "

# INACTIVE WINDOWS
set -g window-status-format "#[fg=#{@ctp_overlay0},bg=#{@ctp_base}] #I:#W "

# ACTIVE WINDOW
set -g window-status-current-format "#[fg=#{@ctp_crust},bg=#{@ctp_lavender},bold] #I:#W "


# PANE BORDERS

# Pane inactivo
set -Fg pane-border-style "fg=#{@ctp_surface1}"

# Pane activo
set -Fg pane-active-border-style "fg=#{@ctp_mauve}"

# TMUX MESSAGES
set -Fg message-style "bg=#{@ctp_surface0},fg=#{@ctp_text},bold"

set -Fg message-command-style "bg=#{@ctp_surface0},fg=#{@ctp_blue},bold"

# COPY MODE
set -Fg mode-style "bg=#{@ctp_blue},fg=#{@ctp_crust},bold"

# CLOCK MODE
setw -Fg clock-mode-colour "#{@ctp_mauve}"

